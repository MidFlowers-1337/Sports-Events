name: sports-events

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sports_events
      MYSQL_USER: sports_app
      MYSQL_PASSWORD: "${SPORTS_DB_PASSWORD:-sports-demo-password}"
      MYSQL_ROOT_PASSWORD: "${SPORTS_DB_ROOT_PASSWORD:-sports-root-demo-password}"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/04-DB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./docs/04-DB/fitness.sql:/docker-entrypoint-initdb.d/03-fitness.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1 FROM fitness_record LIMIT 1'
          >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sports_events?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: sports_app
      SPRING_DATASOURCE_PASSWORD: "${SPORTS_DB_PASSWORD:-sports-demo-password}"
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${SPORTS_APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1/ &&
          wget -q -O /dev/null http://127.0.0.1/v3/api-docs
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
